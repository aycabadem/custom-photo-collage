<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link
      rel="icon"
      href="%PUBLIC_URL%/new-app-icon-512.png?v=30"
      type="image/png"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <meta
      name="description"
      content="Create beautiful photo collages, carousel posts, layouts, and templates with Frame."
    />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/new-icon-192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Frame - Photo Collage Maker</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <script>
      (function () {
        var redirectPath = sessionStorage.getItem("redirectPath");
        if (!redirectPath) {
          return;
        }

        sessionStorage.removeItem("redirectPath");

        var current =
          window.location.pathname +
          window.location.search +
          window.location.hash;

        if (redirectPath === current) {
          return;
        }

        window.history.replaceState(null, "", redirectPath);
      })();
    </script>
  </body>
</html>
